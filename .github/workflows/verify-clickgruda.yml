name: Click & Gruda — Check de código e build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # URL fictícia somente para validar o código. Nunca conecta à produção.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/clickgruda_ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9f9d # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund
      - name: Verificar imports, regressões e novos testes
        run: npm run verify:creative
      - name: Gerar Prisma Client sem migrar banco
        run: npx prisma generate
      - name: Validar TypeScript completo
        run: npx tsc --noEmit
      - name: Compilar Next.js (sem realizar deploy)
        run: npm run build
